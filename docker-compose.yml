version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: neth-postgres
    environment:
      POSTGRES_USER: nethadmin
      POSTGRES_PASSWORD: nethpass
      POSTGRES_DB: nethdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neth-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: neth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neth-network
    restart: unless-stopped

  # NestJS Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: neth-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nethadmin:nethpass@postgres:5432/nethdb
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - neth-network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: neth-frontend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - neth-network
    restart: unless-stopped

# Networks
networks:
  neth-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
  redis_data:
